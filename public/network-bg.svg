  <circle cx="200" cy="280" r="4" class="node"/>
  <circle cx="350" cy="250" r="4" class="node"/>
  <circle cx="500" cy="320" r="4" class="node"/>
  <circle cx="650" cy="280" r="4" class="node"/>
  <circle cx="800" cy="350" r="4" class="node"/>
