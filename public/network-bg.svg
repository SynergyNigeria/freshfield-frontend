  <line x1="450" y1="180" x2="500" y2="320" class="line"/>
  <line x1="600" y1="100" x2="650" y2="280" class="line"/>
  <line x1="750" y1="150" x2="800" y2="350" class="line"/>
  <line x1="900" y1="80" x2="950" y2="300" class="line"/>
  
